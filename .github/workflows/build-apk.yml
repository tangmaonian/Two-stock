name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dual_stock_chart_v1.9.1_source.zip"
          if [ ! -f "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f -name 'dual_stock_chart*_source.zip' | sort -V | tail -n 1)"
          fi
          test -n "$ZIP" && test -f "$ZIP" || { echo "::error::Cannot find source ZIP"; exit 1; }
          echo "Using source archive: $ZIP"
          rm -rf app source_unpacked
          mkdir -p app source_unpacked
          unzip -q "$ZIP" -d source_unpacked
          if [ -f source_unpacked/pubspec.yaml ]; then
            cp -a source_unpacked/. app/
          else
            PUBSPEC="$(find source_unpacked -mindepth 2 -maxdepth 4 -type f -name pubspec.yaml | head -n 1)"
            test -n "$PUBSPEC" || { echo "::error::pubspec.yaml not found"; exit 1; }
            cp -a "$(dirname "$PUBSPEC")"/. app/
          fi
          test -f app/pubspec.yaml
          test -f app/lib/main.dart
          test -f app/lib/data/http_util.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: app
        run: flutter create . --platforms=android --project-name dual_stock_chart --org com.dualstock

      - name: Configure Android manifest
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          sed -i 's#android:label="[^"]*"#android:label="双线股票分析"#' "$MANIFEST"

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          test -f app/build/app/outputs/flutter-apk/app-release.apk
          ls -lh app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-stock-chart-v1.9.1-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
